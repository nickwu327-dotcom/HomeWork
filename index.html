<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本週作業提醒｜11/16–11/22</title>
<style>
  :root {
    --bg: #f4f7fb; --card: #fff; --text: #1f2933; --muted: #6b7785;
    --line: #e3e8ef; --big: #2f6fde; --big-bg: #e8f0fd;
    --small: #d9822b; --small-bg: #fdf1e4; --warn: #c8372d; --done: #9aa5b1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161c; --card: #1c222b; --text: #e6eaf0; --muted: #94a0ae;
      --line: #2c343f; --big: #7aa7ff; --big-bg: #1e2b44;
      --small: #f0a95c; --small-bg: #3a2a18; --warn: #ff7b72; --done: #5d6875;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: .9rem; margin: 0 0 16px; }
  .progress { background: var(--line); border-radius: 99px; height: 8px; overflow: hidden; margin-bottom: 6px; }
  .progress > div { height: 100%; background: var(--big); width: 0; transition: width .3s; }
  .ptext { font-size: .85rem; color: var(--muted); margin-bottom: 20px; }

  .deadlines { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 20px; }
  .deadlines h2 { font-size: 1rem; margin: 0 0 8px; }
  .deadlines ul { margin: 0; padding-left: 18px; font-size: .92rem; }
  .deadlines li { margin: 3px 0; }

  .day { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 14px; overflow: hidden; }
  .day.today { border: 2px solid var(--big); }
  .day.past { opacity: .6; }
  .dhead { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .dhead .date { font-weight: 700; font-size: 1.05rem; }
  .dhead .time { font-size: .82rem; color: var(--muted); }
  .badge { font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; margin-left: 6px; vertical-align: 2px; }
  .badge.today { background: var(--big); color: #fff; }
  .badge.warn { background: var(--warn); color: #fff; }

  .kid { padding: 10px 16px 6px; }
  .kid + .kid { border-top: 1px dashed var(--line); }
  .kname { display: inline-block; font-size: .78rem; font-weight: 700; padding: 1px 10px; border-radius: 99px; margin-bottom: 4px; }
  .kname.big { color: var(--big); background: var(--big-bg); }
  .kname.small { color: var(--small); background: var(--small-bg); }
  label.task { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; cursor: pointer; font-size: .97rem; }
  label.task input { width: 20px; height: 20px; margin: 2px 0 0; flex: none; accent-color: var(--big); }
  label.task.done span { color: var(--done); text-decoration: line-through; }
  .due { color: var(--warn); font-size: .82rem; font-weight: 600; white-space: nowrap; }
  .note { color: var(--muted); font-size: .82rem; }
  .actions { text-align: center; margin-top: 24px; }
  button { font: inherit; font-size: .85rem; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 14px; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📚 本週作業提醒</h1>
  <p class="sub">2026/11/16（一）– 11/22（日）・哥哥 FET／弟弟 CET</p>
  <div class="progress"><div id="bar"></div></div>
  <div class="ptext" id="ptext"></div>

  <div class="deadlines">
    <h2>⏰ 截止日總覽</h2>
    <ul>
      <li><b>11/17（二）</b>弟弟：Vocabulary Worksheet ×1</li>
      <li><b>11/18（三）</b>哥哥：Vocabulary Workbook pp.44–45</li>
      <li><b>11/22（日）</b>哥哥：NRI 完成</li>
      <li><b>11/23（一）</b>哥哥：LAW pp.22–23、myON 本週 1 小時＋AR 測驗（目標 30%）</li>
    </ul>
  </div>

  <div id="days"></div>

  <div class="actions"><button id="reset">清除所有勾選</button></div>
</div>

<script>
const BIG = "哥哥", SMALL = "弟弟";
const DAYS = [
  { date: "2026-11-16", label: "11/16（一）", time: "晚上 7:30", tasks: [
    [SMALL, "Conventions Workbook pp.27–29"],
    [BIG, "Vocabulary Workbook pp.44–45 先寫一半", "週三交"],
    [BIG, "myON 閱讀 15 分鐘"],
  ]},
  { date: "2026-11-17", label: "11/17（二）", time: "晚上 7:30", warn: true, tasks: [
    [SMALL, "Vocabulary Worksheet 一張"],
    [BIG, "Vocabulary Workbook pp.44–45 寫完", "明天交"],
    [BIG, "myON 閱讀 15 分鐘"],
  ]},
  { date: "2026-11-18", label: "11/18（三）", time: "晚上 7:30", tasks: [
    [SMALL, "看聯絡簿當天作業"],
    [BIG, "LAW pp.22–23", "下週一交"],
    [BIG, "myON 閱讀 15 分鐘"],
  ]},
  { date: "2026-11-19", label: "11/19（四）", time: "晚上 7:30", tasks: [
    [SMALL, "看聯絡簿當天作業"],
    [BIG, "複習 MyView 5 Reader U1–2 pp.258–275"],
    [BIG, "myON 閱讀 15 分鐘"],
  ]},
  { date: "2026-11-20", label: "11/20（五）", time: "晚上 7:30", tasks: [
    [SMALL, "看聯絡簿週五作業", null, "老師尚未公布"],
    [BIG, "開始寫 NRI", "11/22 前完成"],
  ]},
  { date: "2026-11-21", label: "11/21（六）", time: "早上 10:00", tasks: [
    [BIG, "NRI 寫完"],
    [BIG, "myON 補滿本週 1 小時＋做 AR 測驗", "目標 30%"],
  ]},
  { date: "2026-11-22", label: "11/22（日）", time: "晚上 7:30", warn: true, tasks: [
    [BIG, "檢查週一要交：LAW、NRI、myON 30%"],
    [SMALL, "週末作業都寫完了嗎"],
  ]},
];

const KEY = "hw-2026-11-16";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function render() {
  const today = todayStr();
  const root = document.getElementById("days");
  root.innerHTML = "";
  let total = 0, done = 0, todayEl = null;

  DAYS.forEach((d, di) => {
    const card = document.createElement("section");
    card.className = "day" + (d.date === today ? " today" : d.date < today ? " past" : "");
    let badges = "";
    if (d.date === today) badges += '<span class="badge today">今天</span>';
    if (d.warn) badges += '<span class="badge warn">交件前一天</span>';
    card.innerHTML = `<div class="dhead"><span class="date">${d.label}${badges}</span><span class="time">⏰ ${d.time}</span></div>`;

    [BIG, SMALL].forEach(kid => {
      const items = d.tasks.map((t, ti) => ({ t, ti })).filter(x => x.t[0] === kid);
      if (!items.length) return;
      const box = document.createElement("div");
      box.className = "kid";
      box.innerHTML = `<span class="kname ${kid === BIG ? "big" : "small"}">${kid}</span>`;
      items.forEach(({ t, ti }) => {
        const id = di + "-" + ti;
        total++; if (state[id]) done++;
        const lab = document.createElement("label");
        lab.className = "task" + (state[id] ? " done" : "");
        lab.innerHTML = `<input type="checkbox" ${state[id] ? "checked" : ""}>
          <span>${t[1]}${t[2] ? ` <span class="due">（${t[2]}）</span>` : ""}${t[3] ? ` <span class="note">${t[3]}</span>` : ""}</span>`;
        lab.querySelector("input").addEventListener("change", e => {
          state[id] = e.target.checked; save(); render();
        });
        box.appendChild(lab);
      });
      card.appendChild(box);
    });
    root.appendChild(card);
    if (d.date === today) todayEl = card;
  });

  document.getElementById("bar").style.width = (total ? done / total * 100 : 0) + "%";
  document.getElementById("ptext").textContent = `已完成 ${done} / ${total} 項`;
  return todayEl;
}

const t = render();
if (t && !location.hash) t.scrollIntoView({ block: "start" });
document.getElementById("reset").addEventListener("click", () => { state = {}; save(); render(); });
</script>
</body>
</html>
